AWSTemplateFormatVersion: '2010-09-09'
Description: Everlore day-1 cheap prod — t4g.small + EIP + SG (no ALB/NAT/ElastiCache)

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: everlore-prod
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.small]
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  ApiHostname:
    Type: String
    Default: api.everloreapp.com
  SshCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: Restrict later to your IP if desired; deploy key auth only

Resources:
  EverloreInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: everlore-ec2-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  EverloreInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: everlore-ec2-profile
      Roles:
        - !Ref EverloreInstanceRole

  EverloreSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: everlore-prod-sg
      GroupDescription: Everlore API HTTP/S and SSH
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP ACME + redirect
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS / WSS
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
          Description: SSH deploy (key-only)
      Tags:
        - Key: Name
          Value: everlore-prod-sg
        - Key: Project
          Value: everlore

  EverloreInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmiId
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref EverloreInstanceProfile
      SecurityGroupIds:
        - !GetAtt EverloreSecurityGroup.GroupId
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee /var/log/everlore-bootstrap.log) 2>&1
          dnf install -y git tar
          dnf install -y redis6 || true
          # Caddy (not in AL2023 repos) — install arm64 binary
          CADDY_VER=2.9.1
          curl -fsSL "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VER}/caddy_${CADDY_VER}_linux_arm64.tar.gz" -o /tmp/caddy.tgz
          tar -xzf /tmp/caddy.tgz -C /usr/local/bin caddy
          chmod +x /usr/local/bin/caddy
          id caddy 2>/dev/null || useradd -r -d /var/lib/caddy -s /sbin/nologin caddy
          mkdir -p /etc/caddy /var/lib/caddy

          # Redis on localhost only
          if [ -f /etc/redis6.conf ]; then
            sed -i 's/^bind .*/bind 127.0.0.1/' /etc/redis6.conf || true
            grep -q '^maxmemory ' /etc/redis6.conf || echo 'maxmemory 384mb' >> /etc/redis6.conf
            grep -q '^maxmemory-policy ' /etc/redis6.conf || echo 'maxmemory-policy noeviction' >> /etc/redis6.conf
            grep -q '^appendonly ' /etc/redis6.conf || echo 'appendonly yes' >> /etc/redis6.conf
          fi
          systemctl enable --now redis6

          # Bun
          curl -fsSL https://bun.sh/install | bash
          useradd -r -m -d /opt/everlore -s /bin/bash everlore || true
          su - everlore -c 'curl -fsSL https://bun.sh/install | bash'
          cp -L /opt/everlore/.bun/bin/bun /usr/local/bin/bun
          chmod 755 /usr/local/bin/bun

          # App directory
          mkdir -p /opt/everlore/app /etc/everlore
          touch /etc/everlore/env
          chmod 600 /etc/everlore/env
          chown everlore:everlore /etc/everlore/env

          # Clone repo (public)
          rm -rf /opt/everlore/app
          su - everlore -c 'git clone --depth 1 https://github.com/SwapnilSkr/everlore-server.git /opt/everlore/app'
          cd /opt/everlore/app && su - everlore -c 'cd /opt/everlore/app && /usr/local/bin/bun install --frozen-lockfile' || true

          # systemd units
          cat > /etc/systemd/system/everlore-api.service <<'UNIT'
          [Unit]
          Description=Everlore API
          After=network.target redis6.service

          [Service]
          Type=simple
          User=everlore
          WorkingDirectory=/opt/everlore/app
          EnvironmentFile=/etc/everlore/env
          ExecStart=/usr/local/bin/bun run start
          Restart=always
          RestartSec=3
          LimitNOFILE=65535

          [Install]
          WantedBy=multi-user.target
          UNIT

          cat > /etc/systemd/system/everlore-worker.service <<'UNIT'
          [Unit]
          Description=Everlore Worker
          After=network.target redis6.service

          [Service]
          Type=simple
          User=everlore
          WorkingDirectory=/opt/everlore/app
          EnvironmentFile=/etc/everlore/env
          ExecStart=/usr/local/bin/bun run start:worker
          Restart=always
          RestartSec=3
          LimitNOFILE=65535

          [Install]
          WantedBy=multi-user.target
          UNIT

          cat > /etc/systemd/system/caddy.service <<'UNIT'
          [Unit]
          Description=Caddy
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=notify
          User=caddy
          Group=caddy
          ExecStart=/usr/local/bin/caddy run --environ --config /etc/caddy/Caddyfile
          ExecReload=/usr/local/bin/caddy reload --config /etc/caddy/Caddyfile --force
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          CapabilityBoundingSet=CAP_NET_BIND_SERVICE
          LimitNOFILE=1048576

          [Install]
          WantedBy=multi-user.target
          UNIT

          systemctl daemon-reload
          systemctl enable everlore-api everlore-worker caddy

          # Caddy reverse proxy (TLS after DNS A record exists)
          cat > /etc/caddy/Caddyfile <<'CADDY'
          ${ApiHostname} {
            encode gzip
            reverse_proxy 127.0.0.1:8081
          }
          CADDY
          chown -R caddy:caddy /etc/caddy /var/lib/caddy

          echo "BOOTSTRAP_DONE $(date -Is)" >> /var/log/everlore-bootstrap.log
      Tags:
        - Key: Name
          Value: everlore-prod
        - Key: Project
          Value: everlore

  EverloreEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: everlore-prod-eip
        - Key: Project
          Value: everlore

  EverloreEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt EverloreEIP.AllocationId
      InstanceId: !Ref EverloreInstance

  EverloreBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: everlore-aws-ceiling
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 12
          Unit: USD
        CostFilters: {}
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: swapnilmkab@gmail.com
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: swapnilmkab@gmail.com
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: swapnilmkab@gmail.com

Outputs:
  InstanceId:
    Value: !Ref EverloreInstance
  ElasticIP:
    Description: Porkbun A record target for api.everloreapp.com
    Value: !Ref EverloreEIP
  PublicDnsName:
    Value: !GetAtt EverloreInstance.PublicDnsName
  SecurityGroupId:
    Value: !GetAtt EverloreSecurityGroup.GroupId
  ApiHostname:
    Value: !Ref ApiHostname
