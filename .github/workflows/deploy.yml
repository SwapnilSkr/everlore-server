name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  deploy:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy through Systems Manager
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "GitHub deploy ${GITHUB_SHA}" \
            --parameters 'commands=["set -euo pipefail","cd /opt/everlore/app","sudo -u everlore git fetch origin main","sudo -u everlore git reset --hard origin/main","sudo -u everlore /usr/local/bin/bun install --frozen-lockfile","sudo systemctl restart everlore-api everlore-worker","sleep 4","systemctl is-active --quiet everlore-api","systemctl is-active --quiet everlore-worker","curl -fsS --max-time 15 http://127.0.0.1:8081/health"]' \
            --query 'Command.CommandId' --output text)"

          for attempt in {1..60}; do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
                  --query StandardOutputContent --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
                  --query '[StandardOutputContent,StandardErrorContent]' --output text || true
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "Timed out waiting for SSM command $command_id" >&2
          exit 1
